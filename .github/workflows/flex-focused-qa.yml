{
  "name": "Flex fresh install and upgrade proof",
  "on": {
    "push": {
      "branches": [
        "qa/openai-flex-20261104"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "qa": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "OPENCLAW_VITEST_RUNTIME": "node",
        "OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE": "1",
        "GOMEMLIMIT": "6GiB",
        "GOGC": "100"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout exact Flex source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "aaf97bd8b2454aba140f9993aad23517462bba53",
            "fetch-depth": 8,
            "persist-credentials": false
          }
        },
        {
          "name": "Official Node and pnpm environment",
          "uses": "./.github/actions/setup-node-env",
          "with": {
            "node-version": "24.22.1",
            "semantic-checks": "true",
            "install-bun": "true",
            "install-deps": "true",
            "cache-mode": "off"
          }
        },
        {
          "name": "Restore previously proven exact runtime",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "flex-qa-runtime",
            "run-id": 41820139497,
            "github-token": "${{ github.token }}",
            "path": "."
          }
        },
        {
          "name": "Verify restored runtime identity",
          "run": "mkdir -p qa-results\nnode -e 'const b=require(\"./dist/build-info.json\");if(b.commit!==\"aaf97bd8b2454aba140f9993aad23517462bba53\")process.exit(1);console.log(JSON.stringify(b))' | tee qa-results/build-identity.log\n"
        },
        {
          "name": "Checkout exact proof harness",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": ".artifacts/qa-harness",
            "sparse-checkout": "qa-flex",
            "sparse-checkout-cone-mode": false,
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Load local proof harness",
          "run": "mkdir -p .artifacts/flex-proof\ncp .artifacts/qa-harness/qa-flex/* .artifacts/flex-proof/\npython3 -m py_compile .artifacts/flex-proof/prove-flex-cli.py .artifacts/flex-proof/prove-package-install-upgrade.py\nnode --check .artifacts/flex-proof/flex-cli-preload.cjs"
        },
        {
          "name": "Package exact candidate",
          "id": "package",
          "continue-on-error": true,
          "timeout-minutes": 12,
          "run": "node scripts/package-openclaw-for-docker.mjs --skip-build --runtime-only --allow-unreleased-changelog --output-dir \"$RUNNER_TEMP/flex-package\" --output-name openclaw-flex-qa.tgz 2>&1 | tee qa-results/package.log\nsha256sum \"$RUNNER_TEMP/flex-package/openclaw-flex-qa.tgz\" > qa-results/candidate-sha256.txt\n"
        },
        {
          "name": "Fresh install and latest stable upgrade",
          "id": "upgrade",
          "if": "steps.package.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 25,
          "run": "candidate_hash=$(cut -d ' ' -f 1 qa-results/candidate-sha256.txt)\npython3 .artifacts/flex-proof/prove-package-install-upgrade.py --candidate \"$RUNNER_TEMP/flex-package/openclaw-flex-qa.tgz\" --candidate-sha256 \"$candidate_hash\" --output \"$PWD/qa-results/install-upgrade\" --stable-version 2026.10.10 | tee qa-results/install-upgrade.log\n"
        },
        {
          "name": "Upload logs",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "flex-qa-results",
            "path": "qa-results/*.log\nqa-results/*.json\nqa-results/*.txt\nqa-results/cli-*/summary.json\nqa-results/cli-*/transport.jsonl\nqa-results/cli-*/stderr.log\nqa-results/cli-*/stdout.json\nqa-results/install-upgrade/*.stdout\nqa-results/install-upgrade/*.stderr\nqa-results/install-upgrade/summary.json\nqa-results/install-upgrade/stable-pin.json\nqa-results/install-upgrade/*-agent/summary.json\nqa-results/install-upgrade/*-agent/transport.jsonl\nqa-results/install-upgrade/*-agent/stderr.log",
            "retention-days": 7
          }
        },
        {
          "name": "Require every verification",
          "if": "always()",
          "env": {
            "OUTCOMES": "${{ steps.package.outcome }} ${{ steps.upgrade.outcome }}"
          },
          "run": "for outcome in $OUTCOMES; do test \"$outcome\" = success || exit 1; done"
        }
      ]
    }
  }
}
