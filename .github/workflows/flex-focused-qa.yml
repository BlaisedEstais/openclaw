{
  "name": "Flex CLI and upgrade proof",
  "on": {
    "push": {
      "branches": [
        "qa/openai-flex-20261104"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qa": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "OPENCLAW_VITEST_RUNTIME": "node",
        "OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE": "1",
        "GOMEMLIMIT": "6GiB",
        "GOGC": "100"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout exact Flex source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "aaf97bd8b2454aba140f9993aad23517462bba53",
            "fetch-depth": 8,
            "persist-credentials": false
          }
        },
        {
          "name": "Official Node and pnpm environment",
          "uses": "./.github/actions/setup-node-env",
          "with": {
            "node-version": "24.22.1",
            "semantic-checks": "true",
            "install-bun": "true",
            "install-deps": "true",
            "cache-mode": "off"
          }
        },
        {
          "name": "Build QA runtime",
          "id": "build",
          "continue-on-error": true,
          "timeout-minutes": 15,
          "run": "node --import ./scripts/tsx.mjs scripts/build-all.mts qaRuntime 2>&1 | tee qa-results/build.log"
        },
        {
          "name": "Checkout exact proof harness",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": ".artifacts/qa-harness",
            "sparse-checkout": "qa-flex",
            "sparse-checkout-cone-mode": false,
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "Load local proof harness",
          "run": "mkdir -p .artifacts/flex-proof\ncp .artifacts/qa-harness/qa-flex/* .artifacts/flex-proof/\npython3 -m py_compile .artifacts/flex-proof/prove-flex-cli.py .artifacts/flex-proof/prove-package-install-upgrade.py\nnode --check .artifacts/flex-proof/flex-cli-preload.cjs"
        },
        {
          "name": "Qualify full CLI fixture",
          "id": "fixture",
          "if": "steps.build.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 7,
          "run": "python3 .artifacts/flex-proof/prove-flex-cli.py --root \"$PWD\" --output \"$PWD/qa-results/cli-smoke\" --delay-ms 1 | tee qa-results/cli-smoke.log"
        },
        {
          "name": "Full CLI Flex survives former watchdog",
          "id": "long_wait",
          "if": "steps.fixture.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 7,
          "run": "python3 .artifacts/flex-proof/prove-flex-cli.py --root \"$PWD\" --output \"$PWD/qa-results/cli-flex-130s\" --delay-ms 130000 | tee qa-results/cli-flex-130s.log"
        },
        {
          "name": "Full CLI Standard still aborts at 120 seconds",
          "id": "ordinary_timeout",
          "if": "steps.fixture.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 7,
          "run": "python3 .artifacts/flex-proof/prove-flex-cli.py --root \"$PWD\" --output \"$PWD/qa-results/cli-standard-120s\" --tier default --delay-ms 130000 --expect timeout | tee qa-results/cli-standard-120s.log"
        },
        {
          "name": "Package exact candidate",
          "id": "package",
          "if": "steps.build.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 12,
          "run": "node scripts/package-openclaw-for-docker.mjs --skip-build --runtime-only --allow-unreleased-changelog --bundle-plugin openai --output-dir \"$RUNNER_TEMP/flex-package\" --output-name openclaw-flex-qa.tgz 2>&1 | tee qa-results/package.log\nsha256sum \"$RUNNER_TEMP/flex-package/openclaw-flex-qa.tgz\" > qa-results/candidate-sha256.txt\n"
        },
        {
          "name": "Fresh install and latest stable upgrade",
          "id": "upgrade",
          "if": "steps.package.outcome == 'success' && steps.fixture.outcome == 'success'",
          "continue-on-error": true,
          "timeout-minutes": 25,
          "run": "candidate_hash=$(cut -d ' ' -f 1 qa-results/candidate-sha256.txt)\npython3 .artifacts/flex-proof/prove-package-install-upgrade.py --candidate \"$RUNNER_TEMP/flex-package/openclaw-flex-qa.tgz\" --candidate-sha256 \"$candidate_hash\" --output \"$PWD/qa-results/install-upgrade\" --stable-version 2026.10.10 | tee qa-results/install-upgrade.log\n"
        },
        {
          "name": "Upload logs",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "flex-qa-results",
            "path": "qa-results/*.log\nqa-results/*.json\nqa-results/*.txt\nqa-results/cli-*/summary.json\nqa-results/cli-*/transport.jsonl\nqa-results/cli-*/stderr.log\nqa-results/cli-*/stdout.json\nqa-results/install-upgrade/*.stdout\nqa-results/install-upgrade/*.stderr\nqa-results/install-upgrade/summary.json\nqa-results/install-upgrade/stable-pin.json\nqa-results/install-upgrade/*-agent/summary.json\nqa-results/install-upgrade/*-agent/transport.jsonl\nqa-results/install-upgrade/*-agent/stderr.log",
            "retention-days": 7
          }
        },
        {
          "name": "Upload portable JavaScript runtime",
          "if": "always() && steps.build.outcome == 'success'",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "flex-qa-runtime",
            "path": "dist/\ndist-runtime/\npackages/*/dist/\nextensions/*/dist/\n!**/*.map",
            "retention-days": 2,
            "compression-level": 1
          }
        },
        {
          "name": "Require every verification",
          "if": "always()",
          "env": {
            "OUTCOMES": "${{ steps.build.outcome }} ${{ steps.fixture.outcome }} ${{ steps.long_wait.outcome }} ${{ steps.ordinary_timeout.outcome }} ${{ steps.package.outcome }} ${{ steps.upgrade.outcome }}"
          },
          "run": "for outcome in $OUTCOMES; do test \"$outcome\" = success || exit 1; done"
        }
      ]
    }
  }
}
